<body>
    <header>
        <h1>bienvenidos a papulandia </h1>

    <main>
        <h2>pe causa</h2>
        
        <video wodth="100%" controls autoplay muted loop>
            <source src="peru.mp4" type="video/mp4">
            tu navegador no soporta el video pinche puta.
            </video>

    <button id="btn-musica" style="position":fixed;bottom:20px;right:20px;z-index:1000;padding:10px15px;border radius:50px;border:none;background:#333;color:white;cursor:pointer;">
        activar musica
    </button>

    <audio id="musica-fondo" loop> 
        <source src="xd.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn= document.getElementById('btn-musica');
        const musica = document.getElementById('musica-fondo');
        let reproduciendo = false;

        btn.addEventListener('click', async () => {
            if (!reproduciendo) {
                try {
                await musica.play();
                reproduciendo =true;
                btn.textcontent = 'silenciar musica';
                } catch (error) {
                    console.log("Error al reproducir:", error);
                }               
            } else {
                musica.pause();
                reproduciendo = false;
                btn.textContent ='Activar musica';
                
            }
        });
    </script>
